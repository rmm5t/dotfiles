"$schema" = 'https://starship.rs/config-schema.json'

format = """
[▒▓](#a3aed2)\
$os\
[](fg:#a3aed2 bg:#769ff0)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$ruby\
$nodejs\
$golang\
$bun\
$rust\
$php\
[](fg:#212736)\
$fill\
[](fg:#212736)\
$aws\
[](fg:#1d2230 bg:#212736)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[fill]
symbol="─"

[directory]
style = "fg:#090c0c bg:#769ff0 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "fg:#769ff0 bg:#212736"
format = "[ $symbol ($version) ]($style)"

[bun]
symbol = ""
style = "fg:#769ff0 bg:#212736"
format = "[ $symbol ($version) ]($style)"

[ruby]
symbol = ""
style = "fg:#769ff0 bg:#212736"
format = "[ $symbol ($version) ]($style)"

[rust]
symbol = ""
style = "fg:#769ff0 bg:#212736"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "fg:#769ff0 bg:#212736"
format = "[ $symbol ($version) ]($style)"

[php]
symbol = ""
style = "fg:#769ff0 bg:#212736"
format = "[ $symbol ($version) ]($style)"

[aws]
symbol = "󰅟 "
style = "fg:#769ff0 bg:#212736"
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'

[time]
disabled = false
time_format = "%r" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[os]
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""